<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniGPT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>MiniGPT</h1>
            <p>Transformer Language Model Built From Scratch</p>
        </header>

        <main>

            <label for="prompt">Enter your prompt</label>

            <textarea
                id="prompt"
                placeholder="Example: Machine"
            ></textarea>

            <div class="controls">

                <div>
                    <label for="temperature">Temperature</label>

                    <input
                        type="number"
                        id="temperature"
                        value="0.5"
                        min="0.1"
                        max="2"
                        step="0.1"
                    >
                </div>

                <div>
                    <label for="topK">Top-K</label>

                    <input
                        type="number"
                        id="topK"
                        value="5"
                        min="1"
                        max="44"
                    >
                </div>

                <div>
                    <label for="tokens">New Tokens</label>

                    <input
                        type="number"
                        id="tokens"
                        value="100"
                        min="1"
                        max="500"
                    >
                </div>

            </div>

            <button id="generateButton">
                Generate
            </button>

            <section class="output-section">

                <h2>Generated Text</h2>

                <div id="output">
                    Your generated text will appear here...
                </div>

            </section>

            <p id="status"></p>

        </main>

        <footer>
            <p>MiniGPT • PyTorch • FastAPI</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
